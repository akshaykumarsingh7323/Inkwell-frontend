<section class="related-posts" *ngIf="relatedPosts.length > 0">
  <div class="section-header">
    <h2>More from Inkwell</h2>
  </div>

  <div class="posts-grid">
    <div class="post-card" *ngFor="let post of relatedPosts">
      <a (click)="handlePostClick(post, $event)" class="card-image" style="cursor: pointer;">
        <img [src]="getPostImage(post)" [alt]="post.title">
      </a>
      <div class="card-content">
        <h3 class="card-title">
          <a (click)="handlePostClick(post, $event)" style="cursor: pointer;">{{ post.title }}</a>
        </h3>
        <div class="card-meta">
          <span>{{ post.readTimeMin || 1 }} min read</span>
          <span class="dot"></span>
          <span>{{ post.publishedAt | date:'mediumDate' }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
