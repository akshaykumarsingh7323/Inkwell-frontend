
<div class="reading-progress-bar" [style.width]="progressWidth" style="position: fixed; top: 0; left: 0; height: 4px; background: #004643; z-index: 9999; transition: width 0.1s ease-out;"></div>

<div class="post-loading" *ngIf="isLoading">
  <div class="spinner"></div>
</div>

<main class="post-main" *ngIf="!isLoading && post">
  <div class="post-article-container" *ngIf="!isLocked">
    <button class="back-btn" (click)="goBack()">
      <span class="material-symbols-outlined">arrow_back</span>
      <span>Back to Feed</span>
    </button>
    <!-- 1. Post Hero Section -->
    <app-post-hero 
      [post]="post" 
      [authorName]="getAuthorName()" 
      [authorAvatar]="getAuthorAvatar()"
      [categoryName]="getCategoryName()"
      [readTime]="estimatedReadTime"
    ></app-post-hero>

  <div class="article-wrapper">
    <article class="post-article">


      <!-- 3. Article Content -->
      <div class="post-content-body" [innerHTML]="post.content"></div>

      <div>
        <div class="post-tags" *ngIf="tags.length > 0">
          <a *ngFor="let tag of tags" [routerLink]="['/tag', tag.slug]" class="tag-pill">#{{ tag.name }}</a>
        </div>

        <!-- 2. Engagement Bar (Inline) -->
        <app-post-engagement [post]="post" [isSticky]="false"></app-post-engagement>

        <!-- 4. Author Bio Section -->
        <app-author-bio *ngIf="authorProfile" [author]="authorProfile"></app-author-bio>

        <!-- 5. Comments System -->
        <app-comments-section 
          [postId]="post.postId" 
          [currentUser]="(currentUser$ | async)"
        ></app-comments-section>
        
        <!-- 6. Related Posts Section -->
        <app-related-posts 
          [postId]="post.postId" 
          [categoryId]="post.categoryId"
        ></app-related-posts>
      </div>
    </article>
  </div>
  </div>
</main>

<div class="post-not-found" *ngIf="!isLoading && !post">
  <h2>Post not found</h2>
  <p>The article you are looking for does not exist or has been removed.</p>
  <a routerLink="/discover" class="btn-primary">Back to Discover</a>
</div>
