version: '3.8'

services:
  inkwell-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inkwell-frontend
    ports:
      - "80:80"
    restart: always
    networks:
      - inkwell-backend_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  inkwell-backend_default:
    external: true

