<div class="auth-wrapper">
  <div class="auth-card fade-in">
    
    <!-- Logo Section -->
    <div class="auth-logo-center">
      <div class="logo-circle">
        <span class="material-symbols-outlined logo-icon">history_edu</span>
      </div>
      <h2 class="logo-text">InkWell</h2>
    </div>

    <div class="auth-header">
      <h1>Recover account</h1>
      <p>Enter your email and we'll send you an OTP.</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="auth-field">
        <div class="input-with-icon">
          <span class="material-symbols-outlined input-icon">mail</span>
          <input
            class="auth-input"
            id="fp-email"
            type="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="Email Address"
            autocomplete="email"
          />
        </div>
      </div>

      <button class="auth-submit-btn" type="submit" [disabled]="loading || !email">
        <span *ngIf="!loading">Send OTP</span>
        <span *ngIf="loading" class="btn-loading">
          <span class="spinner"></span>
          Sending...
        </span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Remembered? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
