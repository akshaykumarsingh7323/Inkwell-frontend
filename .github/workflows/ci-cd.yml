name: Inkwell Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
        continue-on-error: true # Continue to analysis even if tests fail

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=akshaykumarsingh7323
            -Dsonar.projectKey=Inkwell-frontend
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  deploy:
    needs: test-and-analyze
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/inkwell-app
            cd ~/inkwell-app
            
            # Update Frontend code
            if [ ! -d "inkwell-frontend" ]; then
              git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/akshaykumarsingh7323/Inkwell-frontend.git inkwell-frontend
            fi
            cd inkwell-frontend
            git checkout main
            git pull https://x-access-token:${{ secrets.GH_PAT }}@github.com/akshaykumarsingh7323/Inkwell-frontend.git main
            
            # Rebuild and restart Frontend container
            cd ~/inkwell-app/inkwell-frontend
            sudo docker compose up -d --build
            
            # Optional: Ensure backend is also up
            if [ -d "../Inkwell-backend" ]; then
              cd ../Inkwell-backend
              sudo docker compose up -d
            fi

