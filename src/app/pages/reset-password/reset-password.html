<div class="auth-wrapper">
  <div class="auth-card fade-in">
    
    <!-- Logo Section -->
    <div class="auth-logo-center">
      <div class="logo-circle">
        <span class="material-symbols-outlined logo-icon">history_edu</span>
      </div>
      <h2 class="logo-text">InkWell</h2>
    </div>

    <div class="auth-header">
      <h1>Set new password</h1>
      <p>Please choose a strong, secure password.</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="auth-field">
        <div class="input-with-icon">
          <span class="material-symbols-outlined input-icon">key</span>
          <input
            id="rp-otp"
            class="auth-input otp-input"
            type="text"
            [(ngModel)]="token"
            name="token"
            required
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            autocomplete="one-time-code"
          />
        </div>
      </div>

      <div class="auth-field">
        <div class="input-with-icon">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input
            id="rp-password"
            class="auth-input"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="newPassword"
            name="newPassword"
            required
            placeholder="New Password"
            autocomplete="new-password"
          />
          <button type="button" class="password-toggle" (click)="showPassword = !showPassword">
            <span class="material-symbols-outlined">
              {{ showPassword ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
      </div>

      <div class="auth-field">
        <div class="input-with-icon">
          <span class="material-symbols-outlined input-icon">lock_reset</span>
          <input
            id="rp-confirm"
            class="auth-input"
            [class.input-error]="confirmPassword && !passwordsMatch"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
            placeholder="Confirm Password"
            autocomplete="new-password"
          />
        </div>
        <p class="field-error-text" *ngIf="confirmPassword && !passwordsMatch">
          Passwords do not match
        </p>
      </div>

      <button class="auth-submit-btn" type="submit" [disabled]="loading || !isFormValid">
        <span *ngIf="!loading">Reset Password</span>
        <span *ngIf="loading" class="btn-loading">
          <span class="spinner"></span>
          Updating...
        </span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Back to <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
