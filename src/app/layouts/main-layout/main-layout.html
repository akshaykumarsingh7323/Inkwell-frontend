<div id="app-container">
  <!-- Shared Dashboard Layout -->
  <div class="layout">
    <div class="mobile-sidebar-backdrop" [class.open]="mobileSidebarOpen()" (click)="closeMobileSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" *ngIf="currentUser$ | async" [class.mobile-open]="mobileSidebarOpen()">
      <div class="brand">
        <div class="b-ico">✦</div>
        <div>
          <div class="b-name">InkWell</div>
          <div class="b-tag" *ngIf="currentUser$ | async as user">{{ isAdmin(user) ? 'ADMIN v2.0' : (isAuthor(user) ? 'AUTHOR' : 'PLATFORM') }}</div>
          <div class="b-tag" *ngIf="!(currentUser$ | async)">GUEST</div>
        </div>
      </div>
      
      <div class="uinfo console-profile" *ngIf="currentUser$ | async as user">
        <div class="u-lbl">{{ getConsoleLabel(user) }}</div>
        <div class="u-name">{{ getConsoleDisplayName(user) }}</div>
        <div class="u-email">{{ user.email }}</div>
      </div>

      <nav>
        <div class="ns">
          <button class="ni" [class.active]="activeCat() === 'all'" (click)="filterCat('all')">
            <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/>
            </svg>
            All Posts
          </button>
        </div>
        
        <div class="ns" *ngIf="currentUser$ | async as user">
          <button class="ni" routerLink="/become-author" routerLinkActive="active" *ngIf="!isAdmin(user) && !isAuthor(user)">
            <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>
            Create Post
          </button>

          <button class="ni" routerLink="/my-purchases" routerLinkActive="active" *ngIf="!isAdmin(user)">
            <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 4h10a1 1 0 011 1v7a1 1 0 01-1 1H3a1 1 0 01-1-1V5a1 1 0 011-1z"/>
              <path d="M5 4V3a3 3 0 016 0v1"/>
              <path d="M6.5 8.5h3"/>
            </svg>
            My Purchases
          </button>

          <ng-container *ngIf="isAdmin(user) || isAuthor(user)">
            <button class="ni" routerLink="/admin" routerLinkActive="active" *ngIf="isAdmin(user)">
              <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/>
              </svg>
              Overview
            </button>
            <button class="ni" routerLink="/admin-revenue" routerLinkActive="active" *ngIf="isAdmin(user)">
              <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 4h14v10H1V4zM1 7h14M4 10h1M7 10h1M10 10h1"/></svg>
              Revenue
            </button>
          </ng-container>

          <ng-container *ngIf="isAdmin(user)">
            <button class="ni" routerLink="/user-management" routerLinkActive="active">
              <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>
              Users
            </button>
            <button class="ni" routerLink="/admin-author-requests" routerLinkActive="active">
              <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 11h2v-2h2v2h2v2h-2v2h-2v-2h-2v-2zm-4 3c-2.67 0-8 1.34-8 4v2h12v-2c0-.57.17-1.11.45-1.58-.93-.24-2.12-.42-4.45-.42zm0-4c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
              Author Requests
            </button>
            <button class="ni" routerLink="/admin-posts" routerLinkActive="active">
              <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M5 6h6M5 9h4"/></svg>
              Posts
            </button>
            <button class="ni" routerLink="/admin-trending" routerLinkActive="active">
              <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 13h12M2 10l4-4 3 3 5-5"/></svg>
              Trending
            </button>
            <button class="ni" routerLink="/admin-comments" routerLinkActive="active">
              <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h12a1 1 0 011 1v7a1 1 0 01-1 1H5l-3 2V4a1 1 0 011-1z"/></svg>
              Comments
            </button>
            <button class="ni" routerLink="/admin-categories" routerLinkActive="active">
              <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="4" cy="4" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="8" cy="12" r="2"/><path d="M4 6v2a4 4 0 008 0V6"/></svg>
              Categories &amp; Tags
            </button>

            <button class="ni" routerLink="/newsletter-management" routerLinkActive="active">
              <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4l6 4 6-4M2 4h12v9H2V4z"/></svg>
              Newsletter
            </button>

            <button class="ni" routerLink="/admin-subscribers" routerLinkActive="active">
              <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 8a3 3 0 100-6 3 3 0 000 6zm-5 6a5 5 0 0110 0"/></svg>
              Subscribers
            </button>

            <button class="ni" routerLink="/audit-logs" routerLinkActive="active">
              <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2"/></svg>
              Audit Logs
            </button>
          </ng-container>

          <ng-container *ngIf="isAuthor(user) && !isAdmin(user)">
             <button class="ni" routerLink="/author-dashboard" routerLinkActive="active">
               <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                 <rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/>
               </svg>
               Overview
             </button>
             <button class="ni" routerLink="/my-posts" routerLinkActive="active">
               <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M5 6h6M5 9h4"/></svg>
               My Posts
             </button>
             <button class="ni" routerLink="/create-post" routerLinkActive="active">
               <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>
               Create Post
             </button>
             <button class="ni" routerLink="/comment-moderation" routerLinkActive="active">
               <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h12a1 1 0 011 1v7a1 1 0 01-1 1H5l-3 2V4a1 1 0 011-1z"/></svg>
               Comments
             </button>
             <button class="ni" routerLink="/media-library" routerLinkActive="active">
               <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1"/><circle cx="5" cy="5" r="1.5"/><path d="M2 11l3-3 4 4 3-2 2 2"/></svg>
               Media
             </button>
             <button class="ni" routerLink="/post-analytics" routerLinkActive="active">
               <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 13h12M2 10l4-4 3 3 5-5"/></svg>
               Analytics
             </button>
          </ng-container>
        </div>

        <div class="ns" style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; margin-top: 12px;">
          <button class="ni" (click)="goToProfile()">
            <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
            </svg>
            Profile
          </button>
          <button class="ni" (click)="logout()" *ngIf="currentUser$ | async">
            <svg class="ni-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M11 11l3-3-3-3M14 8H6"/>
            </svg>
            Logout
          </button>
        </div>
      </nav>

      <div class="sidebar-ft">
        <div class="vb">inkwell@2.0.1</div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main">
      <header class="topbar">
        <button class="mobile-menu-btn" type="button" aria-label="Open sidebar menu" (click)="toggleMobileSidebar()" *ngIf="currentUser$ | async">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="tnav">
          <span class="tl" routerLink="/home" routerLinkActive="active">Home</span>
          <span class="tl" routerLink="/explore" routerLinkActive="active">Explore</span>
          <span class="tl" [routerLink]="getNewsletterRoute()" routerLinkActive="active">Newsletter</span>
        </div>
        <div class="trgt">
          <div class="ib" (click)="toggleTheme()" style="cursor: pointer;">{{ isDarkMode() ? '🌙' : '☀' }}</div>
          <div class="ib" routerLink="/notifications" *ngIf="currentUser$ | async">🔔</div>
          <div class="av" *ngIf="currentUser$ | async as user" (click)="goToProfile()">{{ getUserInitials(user.fullName || '') }}</div>
          <button class="ni-signin" style="margin-left: 8px;" routerLink="/login" *ngIf="!(currentUser$ | async)">Sign In</button>
        </div>
      </header>

      <div class="content">
        <!-- Dynamic Content Route (Home or Search) -->
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
